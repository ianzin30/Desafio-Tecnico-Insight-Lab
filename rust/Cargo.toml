# The FFI adapter for Flutter lives in `bridge/`; this package stays a plain
# Rust library with no Flutter Rust Bridge dependency.
[workspace]
members = ["bridge"]

[package]
name = "messenger_core"
version = "0.1.0"
edition = "2024"
# Matches the MSRV declared by matrix-sdk 0.19.
rust-version = "1.96"
description = "Native Rust core of the desktop messaging client (Matrix integration)."
publish = false

[dependencies]
# Default features: end-to-end encryption, SQLite stores and rustls TLS.
matrix-sdk = "0.19.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
