[toolchain]
# Required by the Flutter build hook (native_toolchain_rust), which needs an
# exact version for reproducible builds. matrix-sdk needs Rust >= 1.96.
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]
