name: messenger_app
description: "Desktop Matrix messaging client (Flutter UI over the messenger_core Rust engine)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Pinned exactly: must match the Rust crate and the codegen version.
  flutter_rust_bridge: 2.13.0
  # Build hook compiling the Rust bridge crate (Native Assets).
  flutter_rust_bridge_hooks: 2.13.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^4.0.2
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
