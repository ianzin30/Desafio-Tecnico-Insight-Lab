name: messenger_app
description: "Desktop Matrix messaging client (Flutter UI over the messenger_core Rust engine)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # State management and dependency injection of the application layer.
  flutter_riverpod: ^3.4.3
  # Pinned exactly: must match the Rust crate and the codegen version.
  flutter_rust_bridge: 2.13.0
  # Build hook compiling the Rust bridge crate (Native Assets).
  flutter_rust_bridge_hooks: 2.13.0
  # Used by the generated bridge types (sealed classes).
  freezed_annotation: ^3.1.0
  # Per-platform application data directory passed to the Rust core.
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^4.0.2
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # IBM Plex, bundled so the app works offline; its license ships with it.
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
